services:
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardHome
    restart: unless-stopped
    # Bridge network (not host like at home): only the ports below exist from outside.
    # Public DoT is safe because allowed_clients only accepts the phone's ClientID
    # (plus Tailscale/private ranges, which cannot arrive from the internet).
    ports:
      - "853:853/tcp"                 # public: DNS-over-TLS for the phone
      - "<TAILSCALE-IP>:53:53/tcp"     # plain DNS: Tailscale only
      - "<TAILSCALE-IP>:53:53/udp"
      - "<TAILSCALE-IP>:8880:80/tcp"   # web UI: Tailscale only, never public
    networks:
      - default
      - proxy-net                     # VM NPM reaches the UI as adguardHome:80 (Tailscale-only host)
    # Hardening: no Linux capabilities except binding ports below 1024 (53, 80, 853)
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=Europe/Berlin
    volumes:
      - ./conf:/opt/adguardhome/conf
      - ./work:/opt/adguardhome/work
      # read-only access to the TLS cert and key copied from NPM
      - ./certs:/opt/adguardhome/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 600s
      timeout: 5s
      retries: 3
      start_period: 30s

  cert-sync:
    # Hardening: no privilege escalation, only the Linux capabilities this service needs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - FOWNER
    image: alpine:latest
    container_name: adguard-cert-sync
    restart: unless-stopped
    network_mode: none
    volumes:
      # Read Nginx Proxy Manager certificates
      - ../nginx-proxy-manager/letsencrypt:/npm-certs:ro
      # Write to AdGuard certs directory
      - ./certs:/adguard-certs
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "while true; do

        if [ -f /npm-certs/live/npm-3/fullchain.pem ] && [ -f /npm-certs/live/npm-3/privkey.pem ]; then
          cp -L /npm-certs/live/npm-3/fullchain.pem /adguard-certs/fullchain.pem;
          cp -L /npm-certs/live/npm-3/privkey.pem /adguard-certs/privkey.pem;
          chmod 644 /adguard-certs/fullchain.pem;
          chmod 600 /adguard-certs/privkey.pem;
          date +%s > /adguard-certs/.last_sync;
          echo \"[$$(date)] SUCCESS: SSL certificates synchronized from NPM.\";
        else
          echo \"[$$(date)] ERROR: Files missing. Listing /npm-certs contents:\";
          ls -la /npm-certs;
          ls -la /npm-certs/live/npm-3 2>/dev/null || true;
        fi;

        sleep 3600 & wait $${!};
      done"
    healthcheck:
      # Checks if the sync file exists and was modified within the last 65 minutes
      test: ["CMD-SHELL", "find /adguard-certs/.last_sync -mmin -65 | grep -q . || exit 1"]
      interval: 59m
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  proxy-net:
    external: true
