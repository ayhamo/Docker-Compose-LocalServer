services:
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardHome
    restart: unless-stopped
    # Bridge network (not host like at home): only the ports below exist from outside.
    # Public DoT is safe because allowed_clients only accepts the phone's ClientID
    # (plus Tailscale/private ranges, which cannot arrive from the internet).
    ports:
      - "853:853/tcp"                 # public: DNS-over-TLS for the phone
      - "<TAILSCALE-IP>:53:53/tcp"     # plain DNS: Tailscale only
      - "<TAILSCALE-IP>:53:53/udp"
      - "<TAILSCALE-IP>:8880:80/tcp"   # web UI: Tailscale only, never public
    networks:
      - default
      - proxy-net                     # Traefik (Pangolin) reaches the UI as adguardHome:80 (Tailscale-only resource)
    # Hardening: no Linux capabilities except binding ports below 1024 (53, 80, 853)
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=Europe/Berlin
    volumes:
      - ./conf:/opt/adguardhome/conf
      - ./work:/opt/adguardhome/work
      # read-only access to the TLS cert and key exported from Traefik (Pangolin)
      - ./certs:/opt/adguardhome/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 600s
      timeout: 5s
      retries: 3
      start_period: 30s

  cert-sync:
    # Exports the wildcard cert from Traefik's (Pangolin) acme.json as PEM for AdGuard, every hour.
    # cert-reload.sh (cron 02:30) restarts AdGuard when the served cert differs.
    image: ldez/traefik-certs-dumper:latest
    container_name: adguard-cert-sync
    restart: unless-stopped
    network_mode: none
    # Hardening: no privilege escalation, only the Linux capabilities this service needs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - FOWNER
    volumes:
      # Read Traefik's certificate store
      - ../pangolin/config/letsencrypt:/traefik:ro
      # Write to AdGuard certs directory
      - ./certs:/adguard-certs
    tmpfs:
      - /dump                         # all exported certs + ACME account key stay in memory only
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "while true; do
        traefik-certs-dumper file --version v3 --source /traefik/acme.json --dest /dump --domain-subdir --crt-name fullchain --crt-ext .pem --key-name privkey --key-ext .pem >/dev/null 2>&1;
        if [ -s /dump/yourdomain.dedyn.io/fullchain.pem ] && [ -s /dump/yourdomain.dedyn.io/privkey.pem ]; then
          cp /dump/yourdomain.dedyn.io/fullchain.pem /adguard-certs/fullchain.pem;
          cp /dump/yourdomain.dedyn.io/privkey.pem /adguard-certs/privkey.pem;
          chmod 644 /adguard-certs/fullchain.pem;
          chmod 600 /adguard-certs/privkey.pem;
          date +%s > /adguard-certs/.last_sync;
          echo \"[$$(date)] SUCCESS: wildcard cert exported from Traefik.\";
        else
          echo \"[$$(date)] ERROR: yourdomain.dedyn.io cert not found in Traefik acme.json\";
        fi;
        rm -rf /dump/*;
        sleep 3600 & wait $${!};
      done"
    healthcheck:
      # Checks if the sync file exists and was modified within the last 65 minutes
      test: ["CMD-SHELL", "find /adguard-certs/.last_sync -mmin -65 | grep -q . || exit 1"]
      interval: 59m
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  proxy-net:
    external: true
