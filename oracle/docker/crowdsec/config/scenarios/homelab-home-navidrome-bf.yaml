# Homelab: 5 failed logins at HOME Navidrome (web or music app), at any pace -> permanent ban (profiles.yaml).
# Its log arrives by syslog from home (acquis.d/home-navidrome.yaml); the VM's own Navidrome log is a file and
# keeps homelab/navidrome-bf (4 h bans), because friends use that one.
type: leaky
name: homelab/home-navidrome-bf
description: "Home Navidrome failed logins (any pace)"
filter: "evt.Meta.log_type == 'navidrome_failed_auth' && evt.Meta.source_ip != '' && evt.Meta.datasource_type == 'syslog'"
groupby: evt.Meta.source_ip
capacity: 4
leakspeed: 720h
blackhole: 1m
labels:
  service: navidrome
  behavior: generic:bruteforce
  label: "Home Navidrome login brute force"
  remediation: true
