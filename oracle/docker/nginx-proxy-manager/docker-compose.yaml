services:
  nginx-proxy-manager:
    container_name: nginx-proxy-manager
    image: "docker.io/jc21/nginx-proxy-manager:latest"
    restart: unless-stopped
    ports:
      - "80:80"                   # public: HTTP (Lets Encrypt, redirect)
      - "443:443"                 # public: HTTPS
      - "<TAILSCALE-IP>:81:81"     # admin UI: Tailscale only, never public
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:81"]
      interval: 600s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - proxy-net
    depends_on:
      - error-pages

  error-pages:
    # Hardening: no privilege escalation, only the Linux capabilities this service needs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: ghcr.io/tarampampam/error-pages:4
    container_name: error-pages
    restart: unless-stopped
    environment:
      ROTATION_MODE: random-on-each-request
      SHOW_DETAILS: "false"       # public server: do not echo request details
    networks:
      - proxy-net

networks:
  proxy-net:
    external: true
