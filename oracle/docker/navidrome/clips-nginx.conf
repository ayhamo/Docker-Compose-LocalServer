# navidrome-clips: per-song animated backgrounds for the Psysonic / BitChord forks.
# Traefik sends /rest/x-clip/<folder>/<file> here (prefix stripped) only after Navidrome accepted the
# app's login token (forwardAuth). Serves nothing but "<song name>.background.mp4" files one folder
# deep in the music library; everything else is 404. nginx decodes and normalizes the path first,
# so ../ or an encoded "/" can't leave the pattern.
server {
    listen 8080;
    server_name _;
    root /music;
    autoindex off;
    server_tokens off;
    disable_symlinks on;

    location ~ "^/[^/]+/[^/]+\.background\.mp4$" {
        limit_except GET { deny all; }      # GET (and HEAD) only
        add_header Cache-Control "private, max-age=604800" always;
        try_files $uri =404;
    }

    location = /healthz {                   # container healthcheck
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
