services:
  smart-plug:
    # Hardening: no privilege escalation, only the Linux capabilities this service needs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Built locally from the Dockerfile next to this file. There is no registry
    # copy, so Dockhand / Watchtower cannot see updates for it. To update
    # Python, Flask and tinytuya, rebuild (pulls the newest base image and
    # installs the newest package releases allowed by requirements.txt):
    #   docker compose build --pull --no-cache && docker compose up -d
    # To use the image from GitHub instead (built by .github/workflows/docker.yml),
    # replace "build: ." with:
    #   image: ghcr.io/<your-user>/lsc-smart-plug:latest
    build: .
    image: smart-plug:local
    labels:
      - dockhand.update=false   # local build: nothing to check in a registry
    container_name: smart-plug
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
    volumes:
      # config.json (plug ID, IP, local key), state.json, energy.db
      - ./data:/data
    mem_limit: 128m
    # Emergency host port fallback (disabled, routed via NPM):
    # ports:
    #   - "8085:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/status"]
      interval: 600s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - proxy-net

networks:
  proxy-net:
    external: true
