services:
  smart-plug:
    # Hardening: no privilege escalation, only the Linux capabilities this service needs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Image built by GitHub Actions from ayhamo/lsc-smart-plug (amd64 + arm64)
    image: ghcr.io/ayhamo/lsc-smart-plug:latest
    container_name: smart-plug
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
    volumes:
      # config.json (plug ID, IP, local key), state.json, energy.db
      - ./data:/data
    mem_limit: 128m
    # Emergency host port fallback (disabled, routed via NPM):
    # ports:
    #   - "8085:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/info"]
      interval: 600s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - proxy-net

networks:
  proxy-net:
    external: true
