services:
  vdesktop:
    build: .
    container_name: vdesktop
    privileged: true
    security_opt:
      - seccomp:unconfined
    devices:
      - /dev/dri:/dev/dri
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - AUTO_GPU=true
      - DRINODE=/dev/dri/renderD128
    volumes:
      - ./config:/config
    networks:
      - proxy-net
    shm_size: "2gb"
    restart: unless-stopped

networks:
  proxy-net:
    external: true