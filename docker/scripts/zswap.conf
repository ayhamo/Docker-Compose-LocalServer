# Homelab: zswap = compressed cache in RAM in front of /swap/swapfile (fewer SSD writes, faster swap-in).
# zstd is a module on Debian's kernel, so it is set here at boot instead of a kernel parameter.
w /sys/module/zswap/parameters/compressor - - - - zstd
w /sys/module/zswap/parameters/max_pool_percent - - - - 20
w /sys/module/zswap/parameters/shrinker_enabled - - - - Y
w /sys/module/zswap/parameters/enabled - - - - Y
