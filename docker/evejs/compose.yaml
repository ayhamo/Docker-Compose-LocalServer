name: evejs

services:
  init:
    image: evejs-local
    build:
      context: .
      dockerfile: Dockerfile
    command: ["init"]
    volumes:
      - ./data:/var/lib/evejs
    restart: "no"

  market-tools:
    image: evejs-local
    pull_policy: never
    profiles: ["tools"]
    entrypoint:
      - /usr/bin/tini
      - -g
      - --
      - /app/docker/entrypoint.sh
      - market-tools
    command: ["help"]
    volumes:
      - ./data:/var/lib/evejs
    restart: "no"

  market:
    image: evejs-local
    pull_policy: never
    command: ["market"]
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - ./data:/var/lib/evejs
    ports:
      - "0.0.0.0:40110:40110"
      # The RPC port is published so a game server running on the host (outside
      # Docker) can reach the same market daemon the containerised server talks
      # to over the compose network. Loopback-only, like every other publication.
      - "0.0.0.0:40111:40111"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:40110/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    stop_grace_period: 30s

  server:
    tmpfs:
      - /app/server/logs:rw,noexec,nosuid,size=100m
    image: evejs-local
    pull_policy: never
    command: ["server"]
    depends_on:
      market:
        condition: service_healthy
    environment:
      EVEJS_GAMESTORE_DATA_DIR: /var/lib/evejs/gameStore/data
      EVEJS_GAME_SERVER_BIND_HOST: 0.0.0.0
      EVEJS_SERVER_PORT: 26000
      EVEJS_IMAGE_SERVER_BIND_HOST: 0.0.0.0
      EVEJS_IMAGE_SERVER_URL: "${EVEJS_IMAGE_SERVER_URL:-http://127.0.0.1:26001/}"
      EVEJS_MARKET_DAEMON_HOST: market
      EVEJS_MARKET_DAEMON_PORT: "40111"
      EVEJS_MICROSERVICES_BIND_HOST: 0.0.0.0
      EVEJS_MICROSERVICES_PORT: 26002
      EVEJS_MICROSERVICES_PUBLIC_URL: "${EVEJS_MICROSERVICES_PUBLIC_URL:-http://127.0.0.1:26002/}"
      EVEJS_PROXY_LOCAL_INTERCEPT: "1"
      EVEJS_PROXY_LOOPBACK_CDN_LISTEN_PORT: "26003"
      EVEJS_REDSHIFT_MONITOR_HOST: 0.0.0.0
      EVEJS_REDSHIFT_MONITOR_PORT: 26400
      EVEJS_XMPP_CONNECT_HOST: localhost
      EVEJS_XMPP_SERVER_BIND_HOST: 0.0.0.0
      # The browser companion's shared secret. See "Browser companion" in
      # README.md: the /_evejs-web/v1 gateway grants token-less access ONLY to
      # peers whose socket address is 127.0.0.1, and a container's peer is never
      # loopback. Empty (the default) leaves the gateway loopback-only, which is
      # correct when nothing outside this container talks to it.
      EVEJS_WEB_GATEWAY_TOKEN: ${EVEJS_WEB_GATEWAY_TOKEN:-}
    networks:
      default:
        aliases:
          # A stable DNS name for sibling compose projects on evejs-net. The
          # service is called `server`, which is too generic to rely on from
          # another project's containers.
          - evejs-server
    volumes:
      - ./data:/var/lib/evejs
      # Application logs and Node diagnostic reports must survive image rebuilds
      # and container replacement so disconnect incidents remain inspectable.
      # Keep configuration outside the image so ConfigEditor changes only need
      # a container restart, not a rebuild. The server owns first-run seeding.
      - ./config:/app/config
      # The gameStore lives in the evejs-data volume, where the init service
      # builds it. Do NOT bind-mount ./_local/gameStore over it: init does not
      # share that mount, so a fresh install boots an empty universe (or
      # SQLITE_CANTOPEN on a root-owned auto-created dir). The ConfigEditor
      # auto-detects the volume layout and needs no host mount.
      # Alliance logos imported via the ConfigEditor land here on the host and
      # are served live by the image server (see tools/ConfigEditor alliance-logo-*).
      - ./server/src/_secondary/image/generated/Alliance:/app/server/src/_secondary/image/generated/Alliance
      - ./server/certs:/app/server/certs
      - ./server/src/_secondary/express/certs:/app/server/src/_secondary/express/certs
    ports:
      - "0.0.0.0:26003:26003"
      - "0.0.0.0:5222:5222"
      - "0.0.0.0:26000:26000"
      - "0.0.0.0:26001:26001"
      - "0.0.0.0:26002:26002"
      - "0.0.0.0:26400:26400"
    healthcheck:
      test: ["CMD", "node", "/app/server/src/utils/deploymentHealthcheck.js"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 2m
    stop_grace_period: 45s

networks:
  # Named explicitly (instead of the generated `evejs_default`) so the browser
  # companion in ../evejs-web-poc can attach its own container to this same
  # bridge and reach the gateway by DNS. Container-to-container traffic never
  # touches a published host port, so the loopback-only publishing rule at the
  # top of README.md stays intact.
  default:
    name: evejs-net

