# Intercept upstream backend 4xx/5xx errors
proxy_intercept_errors on;

# Route standard errors to the error-pages sidecar
error_page 400 401 403 404 405 408 409 410 429 500 502 503 504 /_error-proxy;

location = /_error-proxy {
    internal;
    proxy_set_header X-Code $status;
    proxy_pass http://error-pages:8080;
}

# Oracle gateway: unpublished apps answer 403 (list in http_top.conf)
if ($oracle_blocked) { return 403; }
