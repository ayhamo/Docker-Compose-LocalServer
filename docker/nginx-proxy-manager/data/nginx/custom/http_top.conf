# Oracle gateway (Pangolin on the Oracle VM) may only reach the home apps published there.
# Add one line per published app; keep it in sync with the Pangolin resources.
map "$remote_addr|$host" $oracle_blocked {
    default 0;
    "~^(<ORACLE-TAILSCALE-IPV4-ESCAPED>|<ORACLE-TAILSCALE-IPV6>)\|" 1;
    "<ORACLE-TAILSCALE-IP>|bentopdf.yourdomain.dedyn.io" 0;
    # "<ORACLE-TAILSCALE-IP>|navidrome.yourdomain.dedyn.io" 0;   # disabled until the app passwords are changed
    "<ORACLE-TAILSCALE-IP>|floppy.yourdomain.dedyn.io" 0;
    "<ORACLE-TAILSCALE-IP>|sure.yourdomain.dedyn.io" 0;
    # "<ORACLE-TAILSCALE-IP>|sparky-fitness.yourdomain.dedyn.io" 0;   # disabled until the app passwords are changed
    # "<ORACLE-TAILSCALE-IP>|immich.yourdomain.dedyn.io" 0;   # disabled until the app passwords are changed
    # "<ORACLE-TAILSCALE-IP>|nextcloud.yourdomain.dedyn.io" 0;   # disabled until the app passwords are changed
    "<ORACLE-TAILSCALE-IP>|snapotter.yourdomain.dedyn.io" 0;
    # "<ORACLE-TAILSCALE-IP>|immich-drop.yourdomain.dedyn.io" 0;   # Pangolin resource exists but is disabled
    # "<ORACLE-TAILSCALE-IP>|app.yourdomain.dedyn.io" 0;
}
