# Wardrowbe auto-login (forward-auth): every request is signed in as ayham. Replaces any Remote-* headers the client sent.
# The secret must equal FORWARD_AUTH_SECRET in /opt/docker/wardrowbe/.env.
# Included from the wardrowbe proxy host's advanced config, inside its own "location / { ... include conf.d/include/proxy.conf; }".
proxy_set_header Remote-User "ayham";
proxy_set_header Remote-Email "ayham@wardrowbe.local";
proxy_set_header Remote-Name "Ayham";
proxy_set_header X-Forward-Auth-Secret "<FORWARD_AUTH_SECRET>";
