services:
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardHome
    restart: unless-stopped
    hostname: ayham
    # RECOMMENDED: Uses your host's native network stack. 
    # This automatically opens all required IPv4 & IPv6 ports below.
    network_mode: host
    # ALTERNATIVE: If you ever comment out host mode and want standard bridge mode,
    # you must uncomment the ports section below. Note: IPv6 will require extra host OS tweaks.
    # ports:
    #   - "53:53/tcp"    # Plain DNS
    #   - "53:53/udp"    # Plain DNS
    #   - "3000:3000/tcp" # Initial Setup Web UI Wizard
    #   - "80:80/tcp"    # Post-Setup Web UI Dashboard Dashboard
    #   - "853:853/tcp"  # DNS-over-TLS (For your Android phone)
    #   - "784:784/udp"  # DNS-over-QUIC (Optional future protocol)
    # Hardening: no Linux capabilities except binding ports below 1024 (53, 853)
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=Europe/Berlin
    volumes:
      # Stores your internal filters and web user interface dashboard settings
      - /opt/docker/adguardhome/conf:/opt/adguardhome/conf
      # Stores persistent runtime metrics and core database components
      - /opt/docker/adguardhome/work:/opt/adguardhome/work
      # gives AdGuard read-only access to the TLS cert and key
      - /opt/docker/adguardhome/certs:/opt/adguardhome/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://127.0.0.1:8443/"]
      interval: 600s
      timeout: 5s
      retries: 3
      start_period: 30s
  
  cert-sync:
    # Hardening: no privilege escalation, only the Linux capabilities this service needs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - FOWNER
    image: alpine:latest
    container_name: adguard-cert-sync
    restart: unless-stopped
    volumes:
      # Read Nginx Proxy Manager certificates
      - /opt/docker/nginx-proxy-manager/letsencrypt:/npm-certs:ro
      # Write to AdGuard certs directory (only when NPM's cert changed; temp file + rename, so AdGuard never reads a half-written file)
      - /opt/docker/adguardhome/certs:/adguard-certs
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "while true; do
      
        if [ -f /npm-certs/live/npm-5/fullchain.pem ] && [ -f /npm-certs/live/npm-5/privkey.pem ]; then
          if cmp -s /npm-certs/live/npm-5/fullchain.pem /adguard-certs/fullchain.pem && cmp -s /npm-certs/live/npm-5/privkey.pem /adguard-certs/privkey.pem; then
            echo \"[$$(date)] Unchanged, nothing copied.\";
          else
            cp -L /npm-certs/live/npm-5/fullchain.pem /adguard-certs/.fullchain.tmp;
            cp -L /npm-certs/live/npm-5/privkey.pem /adguard-certs/.privkey.tmp;
            chmod 644 /adguard-certs/.fullchain.tmp;
            chmod 600 /adguard-certs/.privkey.tmp;
            mv -f /adguard-certs/.privkey.tmp /adguard-certs/privkey.pem;
            mv -f /adguard-certs/.fullchain.tmp /adguard-certs/fullchain.pem;
            echo \"[$$(date)] SUCCESS: new SSL certificate copied from NPM.\";
          fi;
          date +%s > /adguard-certs/.last_sync;
        else
          echo \"[$$(date)] ERROR: Files missing. Listing /npm-certs contents:\";
          ls -la /npm-certs;
          ls -la /npm-certs/live/npm-5 2>/dev/null || true;
        fi;

        sleep 3600 & wait $${!};
      done"
    healthcheck:
      # Checks if the sync file exists and was modified within the last 65 minutes
      test: ["CMD-SHELL", "find /adguard-certs/.last_sync -mmin -65 | grep -q . || exit 1"]
      interval: 59m
      timeout: 5s
      retries: 3
      start_period: 30s

  adguardhome-sync:
    # PAUSED 2026-10-27: the Oracle VM AdGuard is switched off (kept on disk for later).
    # Only starts with:  docker compose --profile oracle-replica up -d
    profiles: ["oracle-replica"]
    # Copies these AdGuard settings (filters, rules, rewrites, clients, DNS settings)
    # to the AdGuard on the Oracle VM every hour. Home is always the origin; never edit the VM copy.
    image: ghcr.io/bakito/adguardhome-sync:latest
    container_name: adguardhome-sync
    restart: unless-stopped
    command: run
    # Hardening: no privilege escalation, no Linux capabilities
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file: .env                                # ORIGIN_/REPLICA1_ USERNAME + PASSWORD (not in git)
    environment:
      ORIGIN_URL: http://192.168.0.214:8880       # this AdGuard (host network)
      REPLICA1_URL: http://<ORACLE-TAILSCALE-IP>:8880     # VM AdGuard UI, over Tailscale
      CRON: "0 * * * *"                           # hourly
      RUN_ON_START: "true"
      API_PORT: "0"                               # no web UI / API of its own
      # The VM keeps its own TLS settings (different ports, DoQ off)
      FEATURES_TLS_CONFIG: "false"
      FEATURES_DHCP_SERVER_CONFIG: "false"
      FEATURES_DHCP_STATIC_LEASES: "false"
