#
# WARNING: To install Immich, follow our guide: https://docs.immich.app/install/docker-compose
#
# Make sure to use the docker-compose.yml of the current release:
#
# https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
#
# The compose file on main may not be compatible with the latest release.

name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    # extends:
    #  file: hwaccel.transcoding.yml
    #  service: quicksync # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
    devices:
      - /dev/dri:/dev/dri
    volumes:
      # Do not edit the next line. If you want to change the media storage location on your system, edit the value of UPLOAD_LOCATION in the .env file
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
      # MOUNT NEXTCLOUD DATA HERE (READ-ONLY)
      - "/mnt/hdd/docker/nextcloud-data/ayham/files/Media - Photos/Phone Photos:/mnt/hdd/docker/nextcloud-data/ayham/files/Media - Photos/Phone Photos:ro"
    env_file:
      - .env
    # ports:
    #  - '2283:2283'
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

    networks:
      - default # to talk to other internal services
      - proxy-net # nginx 

  immich-machine-learning:
    container_name: immich_machine_learning
    # For hardware acceleration, add one of -[armnn, cuda, rocm, openvino, rknn] to the image tag.
    # Example tag: ${IMMICH_VERSION:-release}-cuda
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}-openvino
    # extends: # uncomment this section for hardware acceleration - see https://docs.immich.app/features/ml-hardware-acceleration
    #  file: hwaccel.ml.yml
    #  service: openvino # set to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn] for accelerated inference - use the `-wsl` version for WSL2 where applicable
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /mnt/hdd/docker/immich-ai-models:/cache #- model-cache:/cache # this was moved from ssd to hdd, since its 10gb~
    env_file:
      - .env
    environment:
      # new optimized v2 models (faster, less RAM , maybe check later?)
      - MACHINE_LEARNING_MODEL_REVISION=v2
      # Unload models from RAM after 60 seconds of idle time:
      - MACHINE_LEARNING_MODEL_TTL=60
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Uncomment the DB_STORAGE_TYPE: 'HDD' var if your database isn't stored on SSDs
      # DB_STORAGE_TYPE: 'HDD'
    volumes:
      # Do not edit the next line. If you want to change the database storage location on your system, edit the value of DB_DATA_LOCATION in the .env file
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false

  immich-drop: # to allow login less dropping of photos
    container_name: immich_drop
    image: ghcr.io/nasogaa/immich-drop:latest
    restart: always
    #ports:
    #  - "8080:8000"
    environment:
      # --- Connection to Immich (Uses Docker internal DNS) ---
      IMMICH_BASE_URL: "http://immich-server:2283/api"
      IMMICH_API_KEY: "<REDACTED_IMMICH_API_KEY>"

      # --- Admin & Security ---
      ADMIN_PASSWORD: "<REDACTED_IMMICH_DROP_ADMIN_PASSWORD>"

      # --- Upload & Album Options ---
      IMMICH_ALBUM_NAME: "Guest Drop"        # Default target album if not specified in link
      PUBLIC_UPLOAD_PAGE_ENABLED: "true"    # Set "true" to allow uploads without a token
      MAX_FILE_SIZE_MB: "0"                  # "0" for unlimited file sizes
      MAX_UPLOAD_SIZE_MB: "0"                # "0" for unlimited batch size

      # --- Transfer Optimization ---
      CHUNKED_UPLOADS_ENABLED: "true"        # Highly recommended for large videos
      CHUNK_SIZE_MB: "95"                    # Recommended 50-95 MB for browser chunking
      UPLOAD_TIMEOUT_SECONDS: "3600"         # 1 hour timeout for slow network connections

      # --- Interface & Logging ---
      PAGE_TITLE: "Photo Drop Portal"
      THEME: "dark"                          # Options: dark, light, auto
      LOG_LEVEL: "info"                      # Options: debug, info, warn, error
    
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=2)"]
      interval: 600s
      timeout: 5s
      retries: 3
      start_period: 30s
      
    volumes:
      - immich-drop-data:/data
    depends_on:
      - immich-server
    networks:
      - default                              # To communicate directly with immich-server
      - proxy-net                            # To allow Nginx to reach the Web UI

volumes:
  immich-drop-data:

networks:
  proxy-net:
    external: true
