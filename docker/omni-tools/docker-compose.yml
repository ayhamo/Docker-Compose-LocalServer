services:
  omni-tools:
    image: iib0011/omni-tools:latest
    container_name: omni-tools
    restart: unless-stopped
    # Emergency host port fallback (disabled, routed via NPM):
    # ports:
    #   - "8080:80"
    healthcheck:
      test: ["CMD", "curl", "--fail", "-s", "http://localhost:80/"]
      interval: 600s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - proxy-net

networks:
  proxy-net:
    external: true
