services:
  bentopdf:
    image: ghcr.io/alam00000/bentopdf:latest
    container_name: bentopdf
    restart: unless-stopped
    # ports:
    #   - 8080:8080

    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080 || exit 1"]
      interval: 600s
      timeout: 5s
      retries: 3
      start_period: 30s

    # Note: BentoPDF is completely stateless!
    # No volume mounts are required because no files are ever saved on the server.
    networks:
      - proxy-net

networks:
  proxy-net:
    external: true